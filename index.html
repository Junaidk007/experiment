<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUNAID.OS — Developer Command Center</title>
<meta name="description" content="Gaming-inspired developer portfolio prototype for Junaid Khan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#241116; --shell:#32171D; --panel:#421E26; --elev:#54252E;
  --accent:#B94C59; --pink:#E8A3A6; --text:#F7F1ED; --muted:#BDA9AB; --border:#67414A;
  --radius:22px; --sb:228px;
  --font-h:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-b:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 15% 0%,rgba(185,76,89,.22),transparent 60%),radial-gradient(800px 600px at 100% 100%,rgba(232,163,166,.12),transparent 60%);
  transition:opacity .4s}
body.no-glow::before{opacity:0}
body.no-glow .glow-on{box-shadow:none!important}
h1,h2,h3,h4{font-family:var(--font-h);letter-spacing:.01em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb) minmax(0,1fr);gap:14px;min-height:100vh;padding:14px;max-width:1680px;margin:0 auto}
body.compact{--sb:76px}
.sidebar{position:sticky;top:14px;height:calc(100vh - 28px);background:var(--shell);border:1px solid var(--border);border-radius:28px;padding:18px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-family:var(--font-h);font-weight:700;font-size:18px;letter-spacing:.06em;white-space:nowrap}
.logo-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7d2e3a);display:grid;place-items:center;font-size:17px;flex:none;box-shadow:0 6px 18px rgba(185,76,89,.45)}
.logo b{color:var(--pink)}
.nav{display:flex;flex-direction:column;gap:4px;position:relative;flex:1}
.nav-ind{position:absolute;left:-12px;width:4px;height:28px;border-radius:0 4px 4px 0;background:var(--pink);top:0;transform:translateY(0);transition:transform .35s var(--ease),opacity .2s;opacity:0;box-shadow:0 0 12px var(--pink)}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:14px;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .2s,color .2s,transform .2s}
.nav a:hover{background:rgba(185,76,89,.16);color:var(--text);transform:translateX(2px)}
.nav a.active{background:linear-gradient(90deg,rgba(185,76,89,.55),rgba(185,76,89,.18));color:var(--text);box-shadow:0 0 22px rgba(185,76,89,.28),inset 0 0 0 1px rgba(232,163,166,.25)}
.nav a::after{content:attr(data-tip);position:absolute;left:calc(100% + 14px);top:50%;transform:translate(-6px,-50%);background:var(--elev);border:1px solid var(--border);padding:5px 10px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:30;display:none}
body.compact .nav a{justify-content:center;padding:0}
body.compact .nav a span.lbl,body.compact .logo span.lbl,body.compact .side-foot .lbl{display:none}
body.compact .nav a::after{display:block}
body.compact .nav a:hover::after,body.compact .nav a:focus-visible::after{opacity:1;transform:translate(0,-50%)}
body.compact .logo{justify-content:center;padding:4px 0 14px}
.side-foot{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);flex:none}

.stage{min-width:0;background:var(--shell);border:1px solid var(--border);border-radius:28px;padding:18px 22px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 28px)}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crumb{min-width:0;flex:1 1 220px}
.crumb small{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.crumb small a:hover{color:var(--pink)}
.crumb h2{font-size:24px}
.search-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;min-width:230px;background:var(--bg);border:1px solid var(--border);border-radius:999px;color:var(--muted);transition:.2s}
.search-btn:hover{border-color:var(--accent);color:var(--text)}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--border);border-radius:6px;padding:1px 6px;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;background:rgba(185,76,89,.18);border:1px solid var(--accent);font-size:11px;font-weight:600;letter-spacing:.1em;max-width:100%}
.status .dot{animation:pulse 2.4s infinite}
.status [contenteditable]{outline:none;min-width:40px;white-space:nowrap;cursor:text}
.status [contenteditable]:focus{border-bottom:1px dashed var(--pink)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-h);font-weight:700;background:linear-gradient(135deg,var(--pink),var(--accent));color:#2a0f15;border:2px solid var(--border);cursor:pointer;transition:transform .2s}
.avatar:hover{transform:scale(1.07)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* View + animation */
#view{outline:none;min-width:0}
.view-in{animation:viewIn .45s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
[data-s]{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
body.reduce *,body.reduce *::before,body.reduce *::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}}

/* Generic */
.grid{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;min-width:0}
.panel h3{font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h3 small{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-family:var(--font-h);font-weight:600;font-size:13px;letter-spacing:.08em;transition:transform .2s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn.pri{background:var(--text);color:#3a1219}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.btn.sec{background:rgba(0,0,0,.28);border:1px solid rgba(247,241,237,.35)}
.btn.sec:hover{background:rgba(0,0,0,.45);transform:translateY(-2px)}
.btn.red{background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(185,76,89,.4)}
.btn.red:hover{transform:translateY(-2px);background:#c95a67}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;transform:none!important}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.06em;background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--pink);white-space:nowrap}
.chip.live{background:rgba(232,163,166,.18);border-color:var(--pink)}
.chip.warn{color:#ffd9a6;border-color:#a8774a}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:36px;min-height:300px;background:linear-gradient(120deg,#c25361 0%,#8c3340 48%,#4a1f29 100%);display:flex;align-items:center;box-shadow:0 24px 60px rgba(0,0,0,.4),0 0 60px rgba(185,76,89,.18);isolation:isolate}
.hero-copy{max-width:560px;position:relative;z-index:2}
.eyebrow{font-family:var(--font-h);font-size:12px;letter-spacing:.2em;font-weight:600;color:#ffe3e1;margin-bottom:10px}
.hero h1{font-size:clamp(30px,4.2vw,50px);margin-bottom:8px}
.hero .role{font-family:var(--font-h);font-weight:500;color:#ffe3e1;margin-bottom:14px}
.hero p{color:#f7dcd9;max-width:46ch;margin-bottom:22px}
.hero-art{position:absolute;right:-30px;top:-20px;bottom:-20px;width:52%;z-index:1;opacity:.95;pointer-events:none}
.hero-art svg{width:100%;height:100%}
.spin{transform-origin:50% 50%;animation:spin 40s linear infinite}
.float{animation:float 6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}

.home-grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:14px 16px;transition:transform .25s var(--ease),border-color .25s}
.stat:hover{transform:translateY(-3px);border-color:var(--accent)}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.stat b{font-family:var(--font-h);font-size:17px;display:block;margin-top:4px}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.sect-h h3{font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.link-btn{color:var(--pink);font-size:13px;font-weight:600}
.link-btn:hover{text-decoration:underline}

/* Project cards */
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;width:100%}
.pcard:hover,.pcard:focus-visible{transform:translateY(-6px);border-color:var(--pink);box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 28px rgba(185,76,89,.35)}
.pvis{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--elev)}
.pvis .art{position:absolute;inset:0;transition:transform .6s var(--ease)}
.pcard:hover .art{transform:scale(1.08)}
.pvis img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pvis .tag{position:absolute;top:12px;left:12px;z-index:2}
.pbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h4{font-size:19px}
.pbody .cat{font-size:11px;letter-spacing:.1em;color:var(--pink);text-transform:uppercase;font-weight:600}
.pbody p{color:var(--muted);font-size:13.5px;flex:1}
.mission{margin-top:10px;display:inline-flex;align-items:center;gap:8px;font-family:var(--font-h);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--pink)}
.mission svg{transition:transform .25s}
.pcard:hover .mission svg{transform:translateX(5px)}

/* Side list */
.mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:16px;background:var(--elev);border:1px solid transparent;margin-bottom:8px;transition:.2s}
.mini:hover{border-color:var(--accent);transform:translateX(3px)}
.mini .th{width:44px;height:44px;border-radius:12px;flex:none;overflow:hidden;position:relative}
.mini b{font-family:var(--font-h);display:block;font-size:14px}
.mini small{color:var(--muted);font-size:12px}
.mini .chev{margin-left:auto;color:var(--muted)}
.orb-wrap{display:grid;place-items:center;padding:6px 0 10px}
.orb{width:170px;height:170px;display:grid;place-items:center;text-align:center;border-radius:46% 54% 52% 48%/50% 44% 56% 50%;background:radial-gradient(circle at 30% 25%,#f3b8b6,#b94c59 45%,#52202a 90%);box-shadow:0 0 50px rgba(185,76,89,.5),inset 0 0 30px rgba(0,0,0,.35);animation:morph 9s ease-in-out infinite}
.orb b{font-family:var(--font-h);font-size:28px;display:block}
.orb small{font-size:10px;letter-spacing:.14em;color:#ffe3e1}
@keyframes morph{50%{border-radius:55% 45% 42% 58%/45% 56% 44% 55%;transform:rotate(8deg)}}
.focus-list{list-style:none;display:grid;gap:8px}
.focus-list li{display:flex;gap:10px;align-items:center;background:var(--elev);border-radius:12px;padding:8px 12px;font-size:13.5px}
.profile-card{display:flex;gap:14px;align-items:center}
.profile-card .avatar{width:58px;height:58px;font-size:20px;flex:none;cursor:default}
.quick{display:grid;gap:8px}
.quick a,.quick button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--elev);border:1px solid transparent;transition:.2s;font-weight:500;text-align:left;width:100%}
.quick a:hover,.quick button:hover{border-color:var(--accent);transform:translateX(3px)}
.quick .off{opacity:.55}

/* Projects */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.field{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--bg);border:1px solid var(--border);border-radius:999px;flex:1 1 240px;max-width:420px}
.field:focus-within{border-color:var(--pink)}
.field input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font:inherit}
.field input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);font-family:var(--font-h);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--muted);transition:.2s}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 18px rgba(185,76,89,.45)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:20px}

/* Detail */
.detail-hero{border-radius:28px;overflow:hidden;position:relative;min-height:230px;display:flex;align-items:flex-end;padding:26px;border:1px solid var(--border)}
.detail-hero .art{position:absolute;inset:0}
.detail-hero .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(36,17,22,.92),rgba(36,17,22,.1) 70%)}
.detail-hero > div.in{position:relative;z-index:2}
.detail-hero h1{font-size:clamp(28px,4vw,42px)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.feat{list-style:none;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--elev);font-size:14px}
.feat li .chip{margin-left:auto}
.stack{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 12px;margin-top:10px;background:rgba(0,0,0,.18);border-radius:0 10px 10px 0}

/* Skills */
.skill-cat h3{color:var(--pink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:var(--elev);border:1px solid var(--border);transition:.25s var(--ease);font-weight:500;font-size:13px;text-align:center}
.tile:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 0 22px rgba(185,76,89,.35)}
.tile .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-h);font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),#6d2531);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--accent),var(--pink));border-radius:99px}

/* About / Trophies / Resume */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.timeline{list-style:none;position:relative;padding-left:22px;display:grid;gap:14px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.timeline b{font-family:var(--font-h)}
.char{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.char .big{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font-family:var(--font-h);font-size:34px;font-weight:700;background:linear-gradient(135deg,var(--pink),var(--accent));color:#2a0f15;box-shadow:0 0 36px rgba(185,76,89,.5)}
.trophy{display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:.3s var(--ease)}
.trophy:hover{transform:translateY(-5px);border-color:var(--pink);box-shadow:0 0 28px rgba(185,76,89,.35)}
.trophy .badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,var(--pink),var(--accent) 60%,#5e2330);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.trophy.locked{opacity:.75;border-style:dashed}
.trophy.locked .badge{background:var(--elev);box-shadow:none}
.res-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.res-item{padding:10px 0;border-bottom:1px solid var(--border)}
.res-item:last-child{border:0}

/* Contact / Settings */
form{display:grid;gap:14px}
label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.in{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;outline:none;transition:.2s}
.in:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(232,163,166,.18)}
.in[aria-invalid="true"]{border-color:#ff8a8a}
textarea.in{min-height:130px;resize:vertical}
.err{color:#ffb0b0;font-size:12.5px;min-height:18px;margin-top:4px}
.feedback{padding:12px 14px;border-radius:14px;background:rgba(232,163,166,.14);border:1px solid var(--pink);font-size:14px}
.feedback.bad{background:rgba(255,120,120,.12);border-color:#ff8a8a}
.term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--pink);margin-bottom:10px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.setting:last-of-type{border:0}
.setting b{font-family:var(--font-h);display:block}
.setting small{color:var(--muted)}
.switch{position:relative;width:52px;height:30px;border-radius:99px;background:var(--bg);border:1px solid var(--border);flex:none;transition:.25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .25s var(--ease),background .25s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--pink)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
.switch[disabled]{opacity:.4;cursor:not-allowed}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(20,8,11,.72);backdrop-filter:blur(6px);display:grid;place-items:start center;padding:12vh 16px 16px;animation:fade .2s}
.overlay.center{place-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--shell);border:1px solid var(--border);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .3s var(--ease)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:20px}
.modal-b{padding:20px 22px 24px;display:grid;gap:14px}

.x:hover{background:var(--elev);color:var(--text)}
.pal{padding:0;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;background:none;border:0;outline:none;color:var(--text);font:inherit;font-size:16px;min-width:0}
.pal-list{list-style:none;max-height:min(46vh,340px);overflow:auto;padding:8px}
.pal-list li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;color:var(--muted)}
.pal-list li small{margin-left:auto;font-size:11px;letter-spacing:.08em}
.pal-list li[aria-selected="true"]{background:rgba(185,76,89,.4);color:var(--text)}
.pal-foot{padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:grid;gap:8px;pointer-events:none}
.toast{background:var(--elev);border:1px solid var(--pink);padding:12px 16px;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:rise .3s var(--ease);max-width:min(340px,calc(100vw - 36px));font-size:14px}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}

/* Launch */
.launch{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
.launch.done{opacity:0;visibility:hidden;pointer-events:none}
.launch-in{text-align:center}
.launch-in .logo-mark{width:72px;height:72px;font-size:30px;margin:0 auto 18px;animation:float 3s ease-in-out infinite}
.launch-in h1{font-size:30px;letter-spacing:.2em}
.launch-bar{width:220px;height:4px;border-radius:99px;background:var(--panel);margin:18px auto 14px;overflow:hidden}
.launch-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));animation:load 1.5s var(--ease) forwards;width:0}
@keyframes load{to{width:100%}}

/* Responsive */
@media (max-width:1180px){
  .app{--sb:76px}
  .nav a span.lbl,.logo span.lbl,.side-foot .lbl{display:none}
  .nav a{justify-content:center;padding:0}.logo{justify-content:center;padding:4px 0 14px}
  .nav a::after{display:block}

}
@media (max-width:760px){

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* Sound (opt-in, tiny synthesized blip, never autoplays) */
let audioCtx = null;
function blip(freq){
  if (!settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq || 520;
    g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.14);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.15);
  } catch(e){}
}

let overlayStack = [];
function openOverlay(node, opts){
  opts = opts || {};
  const root = document.getElementById("overlay-root");
  const ov = h("div", { class: "overlay" + (opts.center ? " center" : "") }, node);
  const prev = document.activeElement;
  const entry = { ov, prev };
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeOverlay(entry); });
  root.append(ov); overlayStack.push(entry);
  const f = ov.querySelector("[data-autofocus]") || ov.querySelector("button,input,a[href]");
  if (f) setTimeout(() => f.focus(), 30);
  return entry;
}
function closeOverlay(entry){
  entry = entry || overlayStack[overlayStack.length - 1];
  if (!entry) return;
  entry.ov.remove();
  overlayStack = overlayStack.filter(e => e !== entry);
  if (entry.prev && entry.prev.focus) try { entry.prev.focus(); } catch(e){}
}

    h("div", { class: "modal-b" }, body));

  blip(440);
  if (USE_PATH){
    try { replace ? history.replaceState({}, "", path) : history.pushState({}, "", path); render(); return; }
    catch(e){ USE_PATH = false; }
  }
  if (replace) { try { history.replaceState(null, "", "#" + path); } catch(e){ location.hash = path; } render(); }
  else if (location.hash === "#" + path) render();
  else location.hash = path; // triggers hashchange -> render
}
function resolve(path){
  const nav = NAV.find(n => n.path === path);
  if (nav) return nav;
  const m = path.match(/^\/projects\/([^/]+)$/);
  if (m && getProject(m[1])) return { path: "/projects", detail: m[1] };
  return null;
}
const VIEWS = { "/": viewHome, "/projects": viewProjects, "/skills": viewSkills, "/about": viewAbout, "/achievements": viewAchievements, "/resume": viewResume, "/contact": viewContact, "/settings": viewSettings };
let lastPath = null;
function render(){
  let path = currentPath();
  let r = resolve(path);
  if (!r){
    r = NAV[0]; path = "/";
    if (lastPath !== null) toast("Route not found — returned Home.");
    try { USE_PATH ? history.replaceState({}, "", "/") : history.replaceState(null, "", "#/"); } catch(e){}
  }
  const view = document.getElementById("view");
  const node = r.detail ? viewProject(r.detail) : VIEWS[r.path]();
  stagger(node);
  view.replaceChildren(node);
  view.classList.remove("view-in"); void view.offsetWidth; view.classList.add("view-in");
  // chrome
  const crumbs = [h("a", { href: "#/", onclick: e => { e.preventDefault(); navigate("/"); } }, "JUNAID.OS")];
  let title = r.title;
  if (r.path !== "/"){ crumbs.push(" / ", h("a", { href: "#" + r.path, onclick: e => { e.preventDefault(); navigate(r.path); } }, SHORT[r.path] || r.label)); }
  if (r.detail){ const p = getProject(r.detail); crumbs.push(" / ", p.name); title = p.name; }
  document.getElementById("crumb").replaceChildren(...crumbs);
  document.getElementById("page-title").textContent = title;
  document.title = title + " — JUNAID.OS";
  document.querySelectorAll("#nav a").forEach(a => { const on = a.dataset.path === r.path; a.classList.toggle("active", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  moveIndicator();
  if (lastPath !== null && lastPath !== path) { window.scrollTo(0, 0); view.focus({ preventScroll: true }); }
  lastPath = path;
}
function buildNav(){
  const nav = document.getElementById("nav");
  NAV.forEach(n => {
    const a = h("a", { href: "#" + n.path, "data-path": n.path, "data-tip": n.label, "aria-label": n.label, onclick: e => { e.preventDefault(); navigate(n.path); } },
      icon(n.icon), h("span", { class: "lbl", text: n.label.split(" / ")[0] }));
    nav.append(a);
  });
}
function moveIndicator(){
  const ind = document.getElementById("nav-ind"), act = document.querySelector("#nav a.active");
  if (!ind || !act || window.innerWidth <= 760) { if (ind) ind.style.opacity = 0; return; }
  ind.style.opacity = 1;
  ind.style.transform = "translateY(" + (act.offsetTop + (act.offsetHeight - 28) / 2) + "px)";
}

/* ===================== COMMAND PALETTE ===================== */
function openPalette(){
  if (document.getElementById("pal-input")) return;
  const items = [
    ...NAV.map(n => ({ label: "Go to " + n.label.split(" / ")[0], kind: "PAGE", run: () => navigate(n.path) })),
    ...PROJECTS.map(p => ({ label: "Open " + p.name, kind: "PROJECT", extra: p.tech.join(" ") + " " + p.category, run: () => navigate("/projects/" + p.id) })),
    { label: "Copy email address", kind: "ACTION", run: () => copyText(CONFIG.email) },
    { label: "Toggle ambient glow", kind: "ACTION", run: () => { settings.glow = !settings.glow; saveSettings(); applySettings(); toast("Ambient glow " + (settings.glow ? "on" : "off")); } },
    { label: "Toggle reduced motion", kind: "ACTION", run: () => { settings.reduce = !settings.reduce; saveSettings(); applySettings(); toast("Reduced motion " + (settings.reduce ? "on" : "off")); } }
  ];
  let sel = 0, shown = items, entry;
  const input = h("input", { id: "pal-input", type: "text", placeholder: "Type a command or project…", "aria-label": "Command palette search", autocomplete: "off", role: "combobox", "aria-expanded": "true", "aria-controls": "pal-list", "data-autofocus": "" });
  const list = h("ul", { class: "pal-list", id: "pal-list", role: "listbox" });
  function paint(){
    list.replaceChildren(...(shown.length ? shown.map((it, i) => h("li", { role: "option", id: "pal-o" + i, "aria-selected": String(i === sel), onmousemove: () => { if (sel !== i){ sel = i; mark(); } }, onclick: () => run(it) }, h("span", { text: it.label }), h("small", { text: it.kind })))
      : [h("li", { text: "No results" })]));
    input.setAttribute("aria-activedescendant", shown.length ? "pal-o" + sel : "");
  }
  function mark(){ [...list.children].forEach((li, i) => li.setAttribute("aria-selected", String(i === sel))); input.setAttribute("aria-activedescendant", "pal-o" + sel); }
  function run(it){ closeOverlay(entry); it.run(); }
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    shown = items.filter(i => !q || (i.label + " " + (i.extra || "")).toLowerCase().includes(q)); sel = 0; paint();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown"){ e.preventDefault(); if (shown.length){ sel = (sel + 1) % shown.length; mark(); list.children[sel].scrollIntoView({ block: "nearest" }); } }
    else if (e.key === "ArrowUp"){ e.preventDefault(); if (shown.length){ sel = (sel - 1 + shown.length) % shown.length; mark(); list.children[sel].scrollIntoView({ block: "nearest" }); } }
    else if (e.key === "Enter"){ e.preventDefault(); if (shown[sel]) run(shown[sel]); }
  });
  const box = h("div", { class: "modal pal", role: "dialog", "aria-modal": "true", "aria-label": "Command palette" },
    h("div", { class: "pal-in" }, icon("search"), input, h("span", { class: "kbd", text: "ESC" })), list,
    h("div", { class: "pal-foot", text: "↑ ↓ to navigate · Enter to select · Esc to close" }));
  entry = openOverlay(box);
  paint();
}

/* ===================== INIT ===================== */
function init(){
  loadSettings();
  const savedStatus = store.get("junaidos.status");
  const st = document.getElementById("status-text");
  st.textContent = savedStatus || CONFIG.statusText;
  st.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); st.blur(); } });
  st.addEventListener("blur", () => { const t = st.textContent.trim() || CONFIG.statusText; st.textContent = t; store.set("junaidos.status", t); toast("Status updated."); });

  document.getElementById("kbd-hint").textContent = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘ K" : "Ctrl K";
  buildNav(); applySettings(); render();

  window.addEventListener("popstate", render);
  window.addEventListener("hashchange", render);
  window.addEventListener("resize", () => { applySettings(); });
  document.getElementById("open-pal").addEventListener("click", openPalette);
  document.getElementById("avatar").addEventListener("click", () => navigate("/about"));
  document.getElementById("skip").addEventListener("click", e => { e.preventDefault(); document.getElementById("view").focus(); });
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); overlayStack.length ? closeOverlay() : openPalette(); }
    else if (e.key === "Escape" && overlayStack.length){ e.preventDefault(); closeOverlay(); }
  });

  // Launch overlay: skippable, never blocks content (content is already rendered beneath)
  const launch = document.getElementById("launch");
  const finish = () => launch.classList.add("done");
  document.getElementById("launch-skip").addEventListener("click", finish);
  launch.addEventListener("click", finish);
  document.addEventListener("keydown", finish, { once: true });
  if (reducedMotion()) finish(); else setTimeout(finish, 1300);
}
document.addEventListener("DOMContentLoaded", init);
</script>
